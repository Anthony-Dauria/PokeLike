name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Pack de sprites facultatif. L'adresse n'est pas dans le dépôt : définissez
      # la variable SPRITE_SOURCE (Settings → Secrets and variables → Actions →
      # Variables) pour que le site publié utilise vos images. Sans elle, le jeu
      # affiche ses créatures procédurales.
      - name: Pack de sprites (si SPRITE_SOURCE est défini)
        env:
          FROM: ${{ vars.SPRITE_SOURCE }}
          BACK: ${{ vars.SPRITE_SOURCE_BACK }}
        run: |
          if [ -z "$FROM" ]; then
            echo "SPRITE_SOURCE non défini — créatures procédurales."
            exit 0
          fi
          if [ -n "$BACK" ]; then
            npm run sprites -- --from "$FROM" --back "$BACK"
          else
            npm run sprites -- --from "$FROM"
          fi

      - run: npm run build

      # Pages doit être activé une fois à la main : Settings → Pages →
      # Build and deployment → Source : « GitHub Actions ». Le GITHUB_TOKEN n'a
      # pas le droit de créer le site lui-même (« Resource not accessible by
      # integration »), donc inutile de tenter l'option enablement ici.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
